name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Browsers
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            playwright install --with-deps chromium
          else
            playwright install chromium
          fi

      - name: Run Test Suite
        run: pytest

      - name: Test Mock CLI Workflows (Generator, Backup, Drift)
        run: |
          intunedoc run --mock
          intunedoc backup --mock
          intunedoc diff --mock

      - name: Verify ASD-STE100 Documentation Compliance
        run: intunedoc lint-ste --directory docs

      - name: Verify Markdown Line Lengths (<= 281 chars)
        run: |
          awk 'length > 281 {print FILENAME ":" FNR ":" length; found=1} END {exit found}' \
            README.md AGENTS.md CLAUDE.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
            .agents/skills/intune-visual-doc/SKILL.md docs/WORKFLOW.md \
            docs/PARANOID_ADMIN_SETUP.md docs/adr/*.md setup/*.md
