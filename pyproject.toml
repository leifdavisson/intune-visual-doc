[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intune-visual-doc"
version = "0.1.0"
description = "Automated Microsoft Intune settings documentation with Microsoft Graph and Playwright visual screenshots in ASD-STE100"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Leif Davisson" }
]
keywords = [
    "microsoft-intune",
    "intune",
    "microsoft-graph",
    "playwright",
    "documentation",
    "compliance",
    "asd-ste100",
    "sysadmin",
    "device-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "msal>=1.31.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/leifdavisson/intune-visual-doc"
Documentation = "https://github.com/leifdavisson/intune-visual-doc#readme"
Repository = "https://github.com/leifdavisson/intune-visual-doc.git"
Issues = "https://github.com/leifdavisson/intune-visual-doc/issues"

[project.scripts]
intunedoc = "intune_visual_doc.cli:main"
intune-restore = "scripts.intune_restore:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intune_visual_doc*", "scripts*"]
exclude = ["setup*", "deliverables*", "tests*", "docs*", "examples*"]

